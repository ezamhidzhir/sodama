<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F1F5E8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SODAMA">
<meta name="description" content="Record, label, organise and share sound datasets for machine learning.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>SODAMA — Sound Data Management</title>
<script src="/vendor/tailwind.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand:   { DEFAULT: '#4C7438', dark: '#3C5C2C', tint: '#E4EDD7', soft: '#F1F5E8' },
        accent:  { DEFAULT: '#7A5239', dark: '#63412C', tint: '#F0E7E0' },
        ink:     { DEFAULT: '#1E2A17', secondary: '#4A5643', muted: '#626D58' },
        page:    '#F1F5E8',
        line:    '#DCE5CE',
      },
      borderRadius: { xl2: '1.25rem', xl3: '1.75rem' },
      boxShadow: {
        card: '0 1px 2px rgba(30,42,23,.04), 0 8px 24px -12px rgba(30,42,23,.10)',
        lift: '0 2px 4px rgba(30,42,23,.05), 0 18px 40px -18px rgba(30,42,23,.22)',
      },
      fontFamily: { sans: ['system-ui', '-apple-system', 'Segoe UI', 'sans-serif'] },
    },
  },
}
</script>
<script src="/vendor/chart.umd.min.js"></script>
<script src="/vendor/wavesurfer.min.js"></script>
<script src="/vendor/wavesurfer.regions.min.js"></script>
<style>
  html { scrollbar-gutter: stable; -webkit-tap-highlight-color: transparent; }
  body { background: #F1F5E8; overscroll-behavior-y: none; }
  .nav-link.active { background: #4C7438; color: #fff; }
  .nav-link.active svg { color: #fff; }
  .tab-link.active { color: #3C5C2C; }
  .tab-link.active .tab-dot { opacity: 1; }
  .fade-in { animation: fadeIn .2s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: none;} }
  .sheet-in { animation: sheetIn .22s cubic-bezier(.2,.8,.3,1); }
  @keyframes sheetIn { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .field:focus { outline: none; border-color: #4C7438; box-shadow: 0 0 0 3px rgba(76,116,56,.14); }
  ::selection { background: #E4EDD7; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
  @media (prefers-reduced-motion: reduce) {
    .fade-in, .sheet-in, .animate-ping, .animate-pulse { animation: none !important; }
  }
</style>
</head>
<body class="text-ink min-h-screen font-sans antialiased">

<!-- Auth view (login / signup / forgot / reset) — shown when signed out -->
<div id="authView" class="hidden min-h-screen"></div>

<!-- App shell — shown when signed in -->
<div id="appShell" class="hidden min-h-screen lg:p-5">

  <!-- Phone / tablet: top bar -->
  <header class="lg:hidden sticky top-0 z-40 bg-page/90 backdrop-blur border-b border-line/60"
          style="padding-top:env(safe-area-inset-top)">
    <div class="h-14 px-4 flex items-center justify-between gap-3">
      <a href="#/dashboard" class="flex items-center gap-2.5 min-w-0">
        <span class="w-8 h-8 rounded-full bg-brand text-white grid place-items-center shrink-0" data-mark="waveform"></span>
        <span class="font-bold tracking-wide">SODAMA</span>
      </a>
      <button id="moreBtn" class="flex items-center gap-2 rounded-full pl-1 pr-3 py-1 bg-white border border-line" aria-label="Account and more">
        <span id="topAvatar"></span>
        <span data-icon="menu" class="text-ink-secondary"></span>
      </button>
    </div>
  </header>

  <div class="flex gap-5 lg:min-h-[calc(100vh-2.5rem)]">

    <!-- Desktop: sidebar -->
    <aside class="hidden lg:flex w-64 shrink-0 bg-white rounded-xl3 shadow-card flex-col sticky top-5 self-start max-h-[calc(100vh-2.5rem)]">
      <div class="px-6 pt-7 pb-5">
        <div class="flex items-center gap-2.5">
          <span class="w-9 h-9 rounded-full bg-brand text-white grid place-items-center" data-mark="waveform"></span>
          <div>
            <div class="font-bold leading-tight tracking-wide">SODAMA</div>
            <div class="text-xs text-ink-muted -mt-0.5">Sound Data Management</div>
          </div>
        </div>
      </div>

      <nav class="flex-1 px-4 space-y-1 text-[0.925rem] overflow-y-auto" id="nav">
        <a href="#/dashboard" data-page="dashboard" data-icon="dashboard" class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-full text-ink-secondary hover:bg-brand-soft transition-colors"><span>Dashboard</span></a>
        <a href="#/record"    data-page="record"    data-icon="mic"       class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-full text-ink-secondary hover:bg-brand-soft transition-colors"><span>Record</span></a>
        <a href="#/upload"    data-page="upload"    data-icon="upload"    class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-full text-ink-secondary hover:bg-brand-soft transition-colors"><span>Upload</span></a>
        <a href="#/library"   data-page="library"   data-icon="search"    class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-full text-ink-secondary hover:bg-brand-soft transition-colors"><span>Library</span></a>
        <a href="#/datasets"  data-page="datasets"  data-icon="folder"    class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-full text-ink-secondary hover:bg-brand-soft transition-colors"><span>Datasets</span></a>
        <a href="#/community" data-page="community" data-icon="globe"     class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-full text-ink-secondary hover:bg-brand-soft transition-colors"><span>Community</span></a>
        <a href="#/devices"   data-page="devices"   data-icon="device"    class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-full text-ink-secondary hover:bg-brand-soft transition-colors"><span>Devices</span></a>
      </nav>

      <div class="p-4 mt-2">
        <a href="#/profile" data-page="profile" class="nav-card flex items-center gap-2.5 bg-page rounded-xl2 p-3 hover:bg-brand-tint transition-colors">
          <span id="sideAvatar"></span>
          <div class="min-w-0 flex-1">
            <div class="text-[0.85rem] font-medium truncate" id="sideName"></div>
            <div class="text-xs text-ink-muted truncate" id="sideSub"></div>
          </div>
          <span data-icon="chevronRight" class="text-ink-muted"></span>
        </a>
        <button id="logoutBtn" class="mt-2.5 w-full flex items-center justify-center gap-2 text-sm text-ink-secondary bg-white border border-line rounded-full py-2 hover:border-accent hover:text-accent transition-colors">
          <span data-icon="logout"></span> Sign out
        </button>
        <a href="/docs" target="_blank" class="mt-3 flex items-center justify-center gap-1.5 text-xs text-ink-muted hover:text-brand transition-colors">
          API documentation <span data-icon="external"></span>
        </a>
      </div>
    </aside>

    <main class="flex-1 min-w-0 px-3 sm:px-5 pt-4 pb-32 lg:p-0" id="page"></main>
  </div>

  <!-- Phone / tablet: bottom tab bar. Record sits in the middle, where a thumb rests. -->
  <nav id="tabBar" class="lg:hidden fixed bottom-0 inset-x-0 z-40 bg-white/95 backdrop-blur border-t border-line"
       style="padding-bottom:env(safe-area-inset-bottom)">
    <div class="grid grid-cols-5 h-16 max-w-lg mx-auto">
      <a href="#/dashboard" data-page="dashboard" class="tab-link flex flex-col items-center justify-center gap-0.5 text-[11px] text-ink-muted"><span data-icon="home"></span>Home<span class="tab-dot w-1 h-1 rounded-full bg-brand opacity-0"></span></a>
      <a href="#/library"   data-page="library"   class="tab-link flex flex-col items-center justify-center gap-0.5 text-[11px] text-ink-muted"><span data-icon="search"></span>Library<span class="tab-dot w-1 h-1 rounded-full bg-brand opacity-0"></span></a>
      <a href="#/record"    data-page="record"    class="tab-link flex flex-col items-center justify-start text-[11px] text-ink-muted" aria-label="Record">
        <span class="-mt-5 w-14 h-14 rounded-full bg-brand text-white grid place-items-center shadow-lift ring-4 ring-page" data-mark="mic"></span>Record
      </a>
      <a href="#/datasets"  data-page="datasets"  class="tab-link flex flex-col items-center justify-center gap-0.5 text-[11px] text-ink-muted"><span data-icon="folder"></span>Datasets<span class="tab-dot w-1 h-1 rounded-full bg-brand opacity-0"></span></a>
      <a href="#/community" data-page="community" class="tab-link flex flex-col items-center justify-center gap-0.5 text-[11px] text-ink-muted"><span data-icon="globe"></span>Community<span class="tab-dot w-1 h-1 rounded-full bg-brand opacity-0"></span></a>
    </div>
  </nav>
</div>

<div id="toasts" class="fixed inset-x-0 bottom-24 lg:bottom-6 lg:left-auto lg:right-6 px-4 lg:px-0 flex flex-col items-center lg:items-end gap-2 z-[70] pointer-events-none"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
