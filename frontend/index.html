<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sound Data Management System</title>
<script src="/vendor/tailwind.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand:   { DEFAULT: '#4C7438', dark: '#3C5C2C', tint: '#E4EDD7', soft: '#F1F5E8' },
        accent:  { DEFAULT: '#7A5239', dark: '#63412C', tint: '#F0E7E0' },
        ink:     { DEFAULT: '#1E2A17', secondary: '#4A5643', muted: '#626D58' },
        page:    '#F1F5E8',
        line:    '#DCE5CE',
      },
      borderRadius: { xl2: '1.25rem', xl3: '1.75rem' },
      boxShadow: {
        card: '0 1px 2px rgba(30,42,23,.04), 0 8px 24px -12px rgba(30,42,23,.10)',
        lift: '0 2px 4px rgba(30,42,23,.05), 0 18px 40px -18px rgba(30,42,23,.22)',
      },
      fontFamily: { sans: ['system-ui', '-apple-system', 'Segoe UI', 'sans-serif'] },
    },
  },
}
</script>
<script src="/vendor/chart.umd.min.js"></script>
<script src="/vendor/wavesurfer.min.js"></script>
<style>
  html { scrollbar-gutter: stable; }
  body { background: #F1F5E8; }
  .nav-link.active { background: #4C7438; color: #fff; }
  .nav-link.active svg { color: #fff; }
  .fade-in { animation: fadeIn .2s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: none;} }
  .field:focus { outline: none; border-color: #4C7438; box-shadow: 0 0 0 3px rgba(76,116,56,.14); }
  ::selection { background: #E4EDD7; }
</style>
</head>
<body class="text-ink min-h-screen font-sans antialiased">

<!-- Auth view (login / signup) — shown when signed out -->
<div id="authView" class="hidden min-h-screen"></div>

<!-- App shell — shown when signed in -->
<div id="appShell" class="hidden min-h-screen p-3 lg:p-5">
  <div class="flex gap-5 min-h-[calc(100vh-1.5rem)] lg:min-h-[calc(100vh-2.5rem)]">

    <aside class="w-64 shrink-0 bg-white rounded-xl3 shadow-card flex flex-col">
      <div class="px-6 pt-7 pb-5">
        <div class="flex items-center gap-2.5">
          <span class="w-9 h-9 rounded-full bg-brand text-white grid place-items-center" id="brandMark"></span>
          <div>
            <div class="font-bold leading-tight tracking-wide">SODAMA</div>
            <div class="text-xs text-ink-muted -mt-0.5">Sound Data Management</div>
          </div>
        </div>
      </div>

      <nav class="flex-1 px-4 space-y-1.5 text-[0.925rem]" id="nav">
        <a href="#/dashboard" data-page="dashboard" data-icon="dashboard" class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-full text-ink-secondary hover:bg-brand-soft transition-colors"><span>Dashboard</span></a>
        <a href="#/upload"    data-page="upload"    data-icon="upload"    class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-full text-ink-secondary hover:bg-brand-soft transition-colors"><span>Upload</span></a>
        <a href="#/library"   data-page="library"   data-icon="search"    class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-full text-ink-secondary hover:bg-brand-soft transition-colors"><span>Library</span></a>
        <a href="#/datasets"  data-page="datasets"  data-icon="folder"    class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-full text-ink-secondary hover:bg-brand-soft transition-colors"><span>Datasets</span></a>
        <a href="#/devices"   data-page="devices"   data-icon="device"    class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-full text-ink-secondary hover:bg-brand-soft transition-colors"><span>Devices</span></a>
      </nav>

      <div class="p-4 mt-2">
        <div class="bg-page rounded-xl2 p-4">
          <div class="flex items-center gap-2.5 mb-3">
            <span class="w-8 h-8 rounded-full bg-accent-tint text-accent grid place-items-center shrink-0" id="userMark"></span>
            <div class="min-w-0">
              <div class="text-xs text-ink-muted">Signed in as</div>
              <div class="text-[0.8rem] font-medium truncate" id="userEmail"></div>
            </div>
          </div>
          <button id="logoutBtn" class="w-full flex items-center justify-center gap-2 text-sm text-ink-secondary bg-white border border-line rounded-full py-2 hover:border-accent hover:text-accent transition-colors">
            <span data-icon="logout"></span> Sign out
          </button>
        </div>
        <a href="/docs" target="_blank" class="mt-3 flex items-center justify-center gap-1.5 text-xs text-ink-muted hover:text-brand transition-colors">
          API documentation <span data-icon="external"></span>
        </a>
      </div>
    </aside>

    <main class="flex-1 min-w-0" id="page"></main>
  </div>
</div>

<div id="toasts" class="fixed bottom-6 right-6 space-y-2 z-50"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
